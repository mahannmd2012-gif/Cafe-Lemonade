/* ADMIN CHAT CREATION */
function adminCreateChat(){
  try{
    const users = (typeof db!=="undefined" && Array.isArray(db.users)) ? db.users : [];
    const names = users.filter(u=>u && u.id && u.id!==session?.userId).map(u=>u.name||u.phone||"کاربر");
    const who = prompt("نام کاربر برای چت خصوصی را وارد کنید:\n\n"+(names.length?names.join("، "):"کاربری موجود نیست"));
    if(!who) return;
    const target = users.find(u=>(u.name||u.phone)===who);
    if(!target){ if(typeof toast==="function") toast("کاربر پیدا نشد"); return; }
    if(typeof openPrivateChat==="function"){ openPrivateChat(target.id); return; }
    if(typeof startPrivateChat==="function"){ startPrivateChat(target.id); return; }
    if(typeof toast==="function") toast("امکان ساخت چت در این نسخه پیدا نشد");
  }catch(e){ console.error(e); if(typeof toast==="function") toast("خطا در ساخت چت"); }
}


function addUserToGroupChat(userId){
  try{
    const users = (typeof db!=="undefined" && Array.isArray(db.users)) ? db.users : [];
    const u = users.find(x=>String(x.id)===String(userId));
    if(!u){ if(typeof toast==="function") toast("کاربر پیدا نشد"); return; }
    const groupName = prompt("نام گروه چت را وارد کنید:");
    if(!groupName) return;
    let groups = Array.isArray(db.groups) ? db.groups : [];
    let g = groups.find(x=>String(x.name)===String(groupName));
    if(!g){
      g = {id:"g_"+Date.now(), name:groupName, members:[session?.userId, userId].filter(Boolean), createdAt:Date.now(), messages:[]};
      groups.push(g);
    }else if(!Array.isArray(g.members)){
      g.members=[];
      if(session?.userId) g.members.push(session.userId);
    }
    if(!g.members.map(String).includes(String(userId))) g.members.push(userId);
    db.groups=groups;
    if(typeof saveDB==="function") saveDB();
    if(typeof toast==="function") toast("کاربر به گروه اضافه شد");
    if(typeof render==="function") render();
  }catch(e){ console.error(e); if(typeof toast==="function") toast("خطا در افزودن به گروه"); }
}

const DBKEY="LEMONADE_STABLE_DATABASE_V1";

/* ☁️ همگام‌سازی چنددستگاهی: بدون تغییر ظاهر برنامه.
   برای فعال شدن چت بین دو گوشی، مشخصات پروژه Firebase خودت را اینجا وارد کن.
   اگر خالی باشد، برنامه همچنان به‌صورت آفلاین کار می‌کند. */
const FIREBASE_CONFIG={
  apiKey:"",
  authDomain:"",
  projectId:"",
  storageBucket:"",
  messagingSenderId:"",
  appId:""
};
let cloud=null, cloudReady=false, cloudUnsub=null, cloudWriting=false;
function cloudConfigured(){return !!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId&&FIREBASE_CONFIG.appId)}
function cloudInit(){
  try{
    if(!cloudConfigured()||typeof firebase==="undefined")return false;
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    cloud={auth:firebase.auth(),db:firebase.firestore()}; cloudReady=true; return true;
  }catch(e){console.warn("Cloud init failed",e);cloudReady=false;return false}
}
cloudInit();
function safeLocalSet(k,v){try{localStorage.setItem(k,v)}catch(e){console.warn(e)}}
function cloudDoc(){return cloud?.db?.collection("lemonade").doc("main")||null}
function cloudCol(name){return cloud?.db?.collection("lemonade").doc("main").collection(name)||null}
/* کاربران، چت‌ها و پیام‌ها جداگانه ذخیره می‌شوند تا دو گوشی هم‌زمان اطلاعات یکدیگر را overwrite نکنند. */
function cloudPayload(){return {bugReports:db.bugReports||[],reports:db.reports||[],bannedUsers:db.bannedUsers||[],updatedAt:new Date().toISOString()}}
async function cloudPush(){
  if(!cloudReady||!cloudDoc()||cloudWriting)return;
  try{
    cloudWriting=true;
    await cloudDoc().set(cloudPayload(),{merge:true});
    const batch=cloud.db.batch();
    (db.users||[]).forEach(u=>batch.set(cloudCol("users").doc(String(u.id)),u,{merge:true}));
    (db.chats||[]).forEach(c=>batch.set(cloudCol("chats").doc(String(c.id)),c,{merge:true}));
    (db.messages||[]).forEach(m=>batch.set(cloudCol("messages").doc(String(m.id)),m,{merge:true}));
    await batch.commit();
  }catch(e){console.warn("Cloud sync write failed",e)}finally{cloudWriting=false}
}
function cloudStartListener(){
  if(!cloudReady||cloudUnsub)return;
  const unsubs=[];
  const mainUnsub=cloudDoc().onSnapshot(snap=>{
    if(snap.exists){const x=snap.data()||{};["bugReports","reports","bannedUsers"].forEach(k=>{if(Array.isArray(x[k]))db[k]=x[k]});}
    safeLocalSet(DBKEY,JSON.stringify(db)); if(!cloudWriting)render();
  },e=>console.warn("Cloud main read failed",e));
  unsubs.push(mainUnsub);
  ["users","chats","messages"].forEach(col=>{
    const un=cloudCol(col).onSnapshot(snap=>{
      const rows=[];snap.forEach(d=>rows.push(d.data()));
      db[col]=rows; safeLocalSet(DBKEY,JSON.stringify(db));
      if(!cloudWriting)render();
    },e=>console.warn("Cloud "+col+" read failed",e));
    unsubs.push(un);
  });
  cloudUnsub=()=>unsubs.forEach(fn=>{try{fn()}catch(e){}});
}

function clone(x){return JSON.parse(JSON.stringify(x))}
function mergeMenuCatalog(d){
  const cats=defaultDB.categories||[];
  d.categories=Array.isArray(d.categories)?d.categories:[];
  cats.forEach(c=>{
    let existing=d.categories.find(x=>x.name===c.name||x.id===c.id);
    if(!existing){d.categories.push(clone(c));existing=d.categories[d.categories.length-1]}
    existing.id=c.id; existing.name=c.name; existing.emoji=c.emoji;
  });

  const byId=new Map((d.foods||[]).map(f=>[String(f.id||''),f]));
  const byName=new Map((d.foods||[]).map(f=>[String(f.name||'').trim(),f]));
  defaultDB.foods.forEach(item=>{
    let f=byId.get(item.id)||byName.get(item.name);
    if(!f){
      d.foods.push(clone(item));
    }else{
      // Keep customer/admin price and other custom fields, but synchronize
      // the official menu name/category/sticker.
      f.name=item.name;
      f.categoryId=item.categoryId;
      f.emoji=item.emoji;
      if(typeof f.active!=="boolean") f.active=true;
    }
  });

  // Fix legacy names even if a previous version stored them under old names.
  const legacyNames={
    "چیکن لاویت":"چیکن لاویتا",
    "کراکت پنیری":"کراکف پنیری",
    "بندی کلاسیک":"بندری کلاسیک",
    "بندی ویژه":"بندری ویژه",
    "بندی رویال":"بندری رویال"
  };
  Object.entries(legacyNames).forEach(([oldName,newName])=>{
    const f=d.foods.find(x=>String(x.name||'').trim()===oldName);
    const official=defaultDB.foods.find(x=>x.name===newName);
    if(f && official){
      f.name=newName;
      f.categoryId=official.categoryId;
      f.emoji=official.emoji;
    }
  });

  d.menuCatalogVersion=3;
  return d;
}
function loadDB(){
  try{
    let raw=localStorage.getItem(DBKEY);
    if(!raw){
      raw=localStorage.getItem(LEGACY_DBKEY);
    }
    if(!raw){const fresh=clone(defaultDB);localStorage.setItem(DBKEY,JSON.stringify(fresh));return fresh}
    const d=JSON.parse(raw);
    const merged={...clone(defaultDB),...d,foods:Array.isArray(d.foods)?d.foods:clone(defaultDB.foods),packs:Array.isArray(d.packs)?d.packs:[],users:Array.isArray(d.users)?d.users:[],orders:Array.isArray(d.orders)?d.orders:[],recentOrders:Array.isArray(d.recentOrders)?d.recentOrders:[],reviews:Array.isArray(d.reviews)?d.reviews:[],chats:Array.isArray(d.chats)?d.chats:[],messages:Array.isArray(d.messages)?d.messages:[],bugReports:Array.isArray(d.bugReports)?d.bugReports:[],reports:Array.isArray(d.reports)?d.reports:[],bannedUsers:Array.isArray(d.bannedUsers)?d.bannedUsers:[],rewards:d.rewards||clone(defaultDB.rewards),categories:Array.isArray(d.categories)?d.categories:clone(defaultDB.categories)};
    merged.schemaVersion=7; merged.adminPin="20832083";
    merged.users.forEach(u=>{if(typeof u.onlineVisible!=="boolean")u.onlineVisible=true;if(typeof u.online!=="boolean")u.online=false;if(!u.lastSeenAt)u.lastSeenAt=u.createdAt||new Date().toISOString();});
    merged.orders.forEach(o=>{if(!o.adminDeliveredAt&&o.status==="تحویل شد")o.adminDeliveredAt=o.completedAt||new Date().toISOString();if(!o.customerConfirmedAt)o.customerConfirmedAt=null;});
    merged.recentOrders.forEach(o=>{if(!o.closedAt)o.closedAt=o.completedAt||new Date().toISOString();});
    if(Number(merged.menuCatalogVersion||0)<3)mergeMenuCatalog(merged);
    localStorage.setItem(DBKEY,JSON.stringify(merged));
    return merged;
  }catch(e){const fresh=clone(defaultDB);localStorage.setItem(DBKEY,JSON.stringify(fresh));return fresh}
}
function safeParseJSON(raw,fallback){

  }catch(e){ return fallback; }

function isPackActive(pack){
  const now=Date.now();
  if(pack.startAt && now < new Date(pack.startAt).getTime()) return false;
  if(pack.endAt && now > new Date(pack.endAt).getTime()) return false;
  return pack.active!==false;
}
function packOriginal(pack){
  return (pack.items||[]).reduce((sum,it)=>{
    const f=db.foods.find(x=>x.id===it.foodId);
    return sum+(f?f.price*Number(it.qty||1):0)
  },0);
}
function packFinal(pack){
  const original=Number(pack.originalPrice||packOriginal(pack));
  const discount=Number(pack.discount||0);
  if(Number.isFinite(discount)){
    return Math.max(0,Math.round(original*(1-discount/100)));
  }
  if(pack.finalPrice!=="" && pack.finalPrice!=null && Number(pack.finalPrice)>=0) return Number(pack.finalPrice);
  return original;
}
function packDiscount(pack){
  const o=packOriginal(pack), f=packFinal(pack);
  return o>0?Math.max(0,Math.round((1-f/o)*100)):0;
}

async function copyCardNumber(){
 const card="6219861074718502";
 try{
   if(navigator.clipboard && window.isSecureContext){
     await navigator.clipboard.writeText(card);
   }else{
     const ta=document.createElement("textarea");
     ta.value=card; ta.setAttribute("readonly","");
     ta.style.position="fixed";ta.style.opacity="0";ta.style.left="-9999px";
     document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
     const ok=document.execCommand("copy");
     ta.remove();
     if(!ok) throw new Error("copy failed");
   }
   toast("شماره کارت کامل و درست کپی شد ✅");
 }catch(e){
   toast("کپی خودکار انجام نشد؛ شماره کارت را دستی کپی کنید.");
 }
}

/* Auth - stable modal/auth layer */
function openAuth(msg=""){
 try{
  const modal=document.getElementById("modal"), box=document.getElementById("modalBox");
  if(!modal||!box){alert("پنجره ورود آماده نیست. صفحه را یک‌بار تازه‌سازی کنید.");return;}
  box.innerHTML=`<h2>👤 ورود / ثبت‌نام</h2>${msg?`<div class="note">${esc(msg)}</div><br>`:""}
   <div class="tabs"><button type="button" class="btn tab active" onclick="window.authMode('login')">ورود</button><button type="button" class="btn tab" onclick="window.authMode('register')">ثبت‌نام</button></div>
   <div id="authForm"></div>`;
  modal.classList.add("show");
  authMode("login");
 }catch(e){console.error(e);toast("پنجره ورود باز نشد؛ دوباره تلاش کن.");}
}
function authMode(type){
 const form=document.getElementById("authForm");
 if(!form)return;
 document.querySelectorAll(".tabs .tab").forEach((b,i)=>b.classList.toggle("active",(type==="login"&&i===0)||(type==="register"&&i===1)));
 if(type==="login") form.innerHTML=`
  <div class="field"><label>شماره موبایل</label><input id="aPhone" inputmode="tel" autocomplete="tel" placeholder="0912..." onkeydown="if(event.key==='Enter')window.login()"></div>
  <div class="field"><label>رمز عبور</label><input id="aPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')window.login()"></div>
  <button type="button" class="btn primary" style="width:100%" onclick="window.login()">ورود</button>`;
 else form.innerHTML=`
  <div class="field"><label>نام</label><input id="aName" autocomplete="name"></div>
  <div class="field"><label>شماره موبایل</label><input id="aPhone" inputmode="tel" autocomplete="tel"></div>
  <div class="field"><label>رمز عبور</label><input id="aPass" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter')window.register()"></div>
  <button type="button" class="btn green" style="width:100%" onclick="window.register()">ساخت حساب</button>`;
}
function closeModal(){const m=document.getElementById("modal");if(m)m.classList.remove("show")}

/* Bind authentication controls immediately. If a later optional feature has an error,
   login/register must still remain usable instead of becoming dead buttons. */
window.openAuth=openAuth;
window.authMode=authMode;
window.closeModal=closeModal;
window.login=login;
window.register=register;
window.logout=logout;

function logout(){const u=currentUser();if(u){u.online=false;u.lastSeenAt=new Date().toISOString();save()}session=null;localStorage.removeItem(SESSIONKEY);tab="home";render()}

 return `<div class="section-title"><h2>🎁 پیشنهاد امروز / پک‌های تخفیفی</h2><button class="btn green" onclick="openPackBuilder()">＋ افزودن پک جدید</button></div>
 <div class="note">اینجا خودت انتخاب می‌کنی داخل پک چه چیزهایی باشد؛ مثلاً ۲ پیتزا + ۲ ساندویچ + ۲ لیموناد. سپس قیمت اصلی، درصد تخفیف و حتی قیمت نهایی را تنظیم می‌کنی. تاریخ و ساعت شروع/پایان کاملاً اختیاری است.</div><br>
 <div class="grid">${db.packs.length?db.packs.map(adminPackCard).join(""):`<div class="empty" style="grid-column:1/-1">هنوز هیچ پک تخفیفی نساخته‌ای. روی «افزودن پک جدید» بزن.</div>`}</div>`;
}
function adminPackCard(p){
 const active=isPackActive(p),o=packOriginal(p),f=packFinal(p);
 return `<div class="card">
  <div class="row"><h3>🎁 ${esc(p.name)}</h3><span class="badge ${active?"green":"red"}">${active?"فعال":"غیرفعال/خارج از زمان"}</span></div>
  <p class="muted">${esc(p.description||"بدون توضیحات")}</p>
  <div class="packitems">${p.items.map(it=>{const f=db.foods.find(x=>x.id===it.foodId);return f?`<div class="itemline"><span>${f.emoji} ${esc(f.name)}</span><b>×${it.qty}</b></div>`:""}).join("")}</div>
  <div class="row"><span>قیمت اصلی</span><span class="old">${money(o)}</span></div>
  <div class="row"><span>قیمت فروش</span><span class="price">${money(f)}</span></div>
  <div class="row"><span>تخفیف</span><b>${packDiscount(p)}%</b></div>
  <div class="muted" style="font-size:12px;margin-top:10px">${timeInfo(p)}</div>
  <div class="row" style="margin-top:12px">
   <button class="btn primary" onclick="openPackBuilder('${p.id}')">ویرایش</button>
   <button class="btn ${p.active===false?"green":"yellow"}" onclick="togglePack('${p.id}')">${p.active===false?"فعال‌سازی":"غیرفعال‌سازی"}</button>
   <button class="btn red" onclick="deletePack('${p.id}')">حذف</button>
  </div>
 </div>`;
}
function openPackBuilder(id=""){
 const p=id?db.packs.find(x=>x.id===id):null;
 const selected={};
 (p?.items||[]).forEach(x=>selected[x.foodId]=Math.max(1,Number(x.qty)||1));

 const rows=db.foods.filter(f=>f.active).map(f=>`<div class="row pack-menu-row" data-food-row="${f.id}" style="padding:10px;border-bottom:1px solid #1c3349">
   <span style="flex:1">${f.emoji} ${esc(f.name)} <small class="muted">(${money(f.price)})</small></span>
   <button type="button" class="btn primary" onclick="addPackFood('${f.id}')">＋ افزودن</button>
 </div>`).join("");

 document.getElementById("modalBox").innerHTML=`<h2>${p?"✏️ ویرایش پک":"🎁 ساخت پک تخفیفی جدید"}</h2>
 <div class="formgrid">
  <div class="field"><label>نام پک</label><input id="pName" value="${esc(p?.name||"پک ویژه امروز")}"></div>
  <div class="field"><label>توضیحات</label><input id="pDesc" value="${esc(p?.description||"پک ویژه با تخفیف")}"></div>

  <div class="field full">
   <label>انتخاب اقلام پک</label>
   <div class="note" style="margin-bottom:8px">
    <strong>${p?"اقلام فعلی پک نمایش داده می‌شوند؛ می‌توانی تغییرشان بدهی.":"هیچ محصولی از قبل انتخاب نشده."}</strong>
    هر محصولی را با «＋ افزودن» اضافه کن و تعداد را با + و − تنظیم کن.
   </div>
   <input id="packMenuSearch" placeholder="جستجو در منو؛ مثلاً پیتزا یا لیموناد..." oninput="filterPackMenu(this.value)">
   <div id="packMenuList" class="adminbox" style="margin:8px 0 0;padding:8px">${rows}</div>
   <div id="selectedPackItems" class="adminbox" style="margin:10px 0 0;padding:10px">${renderSelectedPackItems(selected)}</div>
  </div>

  <div class="field full">
    <label>درصد تخفیف</label>
    <div class="row wrap">
      <input id="pDiscount" type="number" min="0" max="100" step="0.01"
             value="${p?.discount??0}" placeholder="مثلاً 50"
             style="flex:1" oninput="previewPackPrice()">
      <button type="button" class="btn yellow" onclick="applyPackDiscount()">اعمال تخفیف</button>
    </div>
    <div id="discountApplyMsg" class="muted" style="margin-top:7px">مثلاً 50٪ یعنی قیمت نهایی نصف قیمت اصلی می‌شود.</div>
  </div>

  <div class="field full">
    <div id="packPreview" class="note">محصولات را انتخاب کن تا قیمت محاسبه شود.</div>
  </div>

  <div class="field"><label>شروع - تاریخ و ساعت (اختیاری)</label>
    <input id="pStart" type="datetime-local" value="${p?.startAt?toLocalDateTime(p.startAt):""}">
  </div>
  <div class="field"><label>پایان - تاریخ و ساعت (اختیاری)</label>
    <input id="pEnd" type="datetime-local" value="${p?.endAt?toLocalDateTime(p.endAt):""}">
  </div>
 </div>

 <div class="row wrap">
   <button class="btn" onclick="closeModal()">لغو</button>
   <button class="btn green" onclick="savePack('${id}')">💾 ذخیره پک و اعمال برای مشتری</button>
 </div>`;

 document.getElementById("modal").classList.add("show");
 window.__packSelected=selected;
 window.__packDiscountApplied=Number(p?.discount||0);
 previewPackPrice();
}

function renderSelectedPackItems(selected=window.__packSelected||{}){
 const entries=Object.entries(selected).filter(([,q])=>Number(q)>0);
 if(!entries.length)return '<div class="muted" style="text-align:center;padding:10px">هنوز چیزی به پک اضافه نکرده‌ای.</div>';
 return entries.map(([foodId,qty])=>{
   const f=db.foods.find(x=>x.id===foodId);
   if(!f)return "";
   return `<div class="row" style="padding:9px 0;border-bottom:1px solid #20374e">
     <div><b>${f.emoji} ${esc(f.name)}</b><div class="muted" style="font-size:12px">${money(f.price)} برای هر عدد</div></div>
     <div class="qty">
       <button type="button" class="btn" onclick="changePackFoodQty('${f.id}',-1)">−</button>
       <b>${qty}</b>
       <button type="button" class="btn" onclick="changePackFoodQty('${f.id}',1)">+</button>
       <button type="button" class="btn red" onclick="removePackFood('${f.id}')">حذف</button>
     </div>
   </div>`;
 }).join("");
}

function addPackFood(id){
 window.__packSelected=window.__packSelected||{};
 window.__packSelected[id]=(Number(window.__packSelected[id])||0)+1;
 const el=document.getElementById("selectedPackItems");
 if(el)el.innerHTML=renderSelectedPackItems();
 previewPackPrice();
}

function changePackFoodQty(id,delta){
 window.__packSelected=window.__packSelected||{};
 const next=(Number(window.__packSelected[id])||0)+delta;
 if(next<=0)delete window.__packSelected[id];
 else window.__packSelected[id]=next;
 const el=document.getElementById("selectedPackItems");
 if(el)el.innerHTML=renderSelectedPackItems();
 previewPackPrice();
}

function removePackFood(id){
 if(window.__packSelected)delete window.__packSelected[id];
 const el=document.getElementById("selectedPackItems");
 if(el)el.innerHTML=renderSelectedPackItems();
 previewPackPrice();
}

function filterPackMenu(q){
 const term=(q||"").trim().toLowerCase();
 document.querySelectorAll("#packMenuList .pack-menu-row").forEach(row=>{
   row.style.display=row.innerText.toLowerCase().includes(term)?"flex":"none";
 });
}

function getBuilderItems(){
 return Object.entries(window.__packSelected||{}).map(([foodId,qty])=>({
   foodId,
   qty:Math.max(1,Number(qty)||1)
 }));
}

function builderOriginal(){
 return getBuilderItems().reduce((s,it)=>{
   const f=db.foods.find(x=>x.id===it.foodId);
   return s+(f?Number(f.price||0)*it.qty:0);
 },0);
}

function toLocalDateTime(s){
 const d=new Date(s);
 if(isNaN(d))return "";
 const p=n=>String(n).padStart(2,"0");
 return `${d.getFullYear()}-${p(d.getMonth()+1)}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function calculatedPackFinal(){
 const original=builderOriginal();
 const pct=Number(document.getElementById("pDiscount")?.value||0);
 if(!original)return 0;
 if(!Number.isFinite(pct))return original;
 return Math.max(0,Math.round(original*(1-pct/100)));
}

function previewPackPrice(){
 const el=document.getElementById("packPreview");
 if(!el)return;
 const o=builderOriginal();
 const raw=Number(document.getElementById("pDiscount")?.value||0);
 const d=Math.min(100,Math.max(0,Number.isFinite(raw)?raw:0));
 const final=o?Math.max(0,Math.round(o*(1-d/100))):0;
 el.innerHTML=`قیمت اصلی انتخاب‌ها: <b>${money(o)}</b>
   <span style="margin:0 6px">|</span>
   تخفیف: <b>${d}%</b>
   <span style="margin:0 6px">|</span>
   قیمت نهایی: <b class="price">${money(final)}</b>`;
}

function applyPackDiscount(){
 const msg=document.getElementById("discountApplyMsg");
 const input=document.getElementById("pDiscount");
 const pct=Number(input?.value||0);
 const original=builderOriginal();

 if(!original){
   if(msg)msg.textContent="اول حداقل یک محصول به پک اضافه کن.";
   return;
 }
 if(!Number.isFinite(pct)||pct<0||pct>100){
   if(msg)msg.textContent="درصد تخفیف باید بین 0 تا 100 باشد.";
   return;
 }

 const final=Math.max(0,Math.round(original*(1-pct/100)));
 window.__packDiscountApplied=pct;
 previewPackPrice();

 if(msg)msg.textContent=`تخفیف ${pct}% اعمال شد؛ قیمت نهایی ${money(final)} است.`;
 toast(`تخفیف ${pct}% اعمال شد ✅`);
}

function savePack(id){
 const name=document.getElementById("pName")?.value.trim();
 const items=getBuilderItems();
 if(!name)return toast("نام پک را وارد کن.");
 if(!items.length)return toast("حداقل یک محصول را به پک اضافه کن.");

 const start=document.getElementById("pStart")?.value||"";
 const end=document.getElementById("pEnd")?.value||"";
 if(start&&end&&new Date(start)>=new Date(end)){
   return toast("زمان پایان باید بعد از زمان شروع باشد.");
 }

 let discount=Number(document.getElementById("pDiscount")?.value||0);
 if(!Number.isFinite(discount)||discount<0||discount>100){
   return toast("درصد تخفیف باید بین 0 تا 100 باشد.");
 }
 discount=Math.min(100,Math.max(0,discount));

 const original=items.reduce((sum,it)=>{
   const f=db.foods.find(x=>x.id===it.foodId);
   return sum+(f?Number(f.price||0)*Number(it.qty||1):0);
 },0);
 if(original<=0)return toast("قیمت محصولات پک معتبر نیست.");

 const finalPrice=Math.max(0,Math.round(original*(1-discount/100)));

 const obj={
   id:id||uid("pack"),
   name,
   description:document.getElementById("pDesc")?.value.trim()||"",
   items,
   discount,
   finalPrice,
   originalPrice:original,
   startAt:start?new Date(start).toISOString():"",
   endAt:end?new Date(end).toISOString():"",
   active:true,
   updatedAt:new Date().toISOString()
 };

 const index=db.packs.findIndex(x=>x.id===obj.id);
 if(index>=0)db.packs[index]=obj;
 else db.packs.unshift(obj);

 save();
 window.__packSelected={};
 window.__packDiscountApplied=0;
 closeModal();
 toast("پک ذخیره شد و برای مشتریان نمایش داده می‌شود 🎉");
 tab="packs";
 render();
}

function togglePack(id){const p=db.packs.find(x=>x.id===id);if(!p)return;p.active=p.active===false;save();render()}
function deletePack(id){if(!confirm("این پک حذف شود؟"))return;db.packs=db.packs.filter(x=>x.id!==id);save();render()}

/* Foods + Categories */
function categoryById(id){return db.categories.find(c=>c.id===id)}
function categoryName(id){const c=categoryById(id);return c?c.name:"بدون دسته"}
function foodImage(f){return f.image?`<img src="${f.image}" alt="" style="width:100%;height:180px;object-fit:cover;border-radius:14px;border:1px solid #29435e;margin-bottom:10px">`:`<div style="font-size:52px;text-align:center;padding:22px;background:#081523;border-radius:14px;margin-bottom:10px">${esc(f.emoji||"🍔")}</div>`}
function adminFoods(){
 const cats=db.categories||[];
 return `<div class="section-title"><h2>🍔 مدیریت غذاها</h2><div class="row wrap"><button class="btn yellow" onclick="openCategoryManager()">🏷️ مدیریت دسته‌بندی‌ها</button><button class="btn green" onclick="openFoodBuilder()">＋ غذای جدید</button></div></div>
 <div class="adminbox"><div class="row wrap"><div style="flex:1;min-width:220px"><label>جستجوی غذا</label><input id="foodSearch" placeholder="نام، توضیحات یا دسته..." oninput="filterFoodsAdmin()"></div><div style="min-width:200px"><label>دسته‌بندی</label><select id="foodCatFilter" onchange="filterFoodsAdmin()"><option value="">همه دسته‌ها</option>${cats.map(c=>`<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join("")}</select></div></div></div>
 <div id="foodsGrid" class="grid">${db.foods.map(foodAdminCard).join("")}</div>`;
}
function foodAdminCard(f){
 return `<div class="card food-admin-card" data-search="${esc((f.name+" "+(f.description||"")+" "+categoryName(f.categoryId)).toLowerCase())}" data-cat="${esc(f.categoryId||"")}">
  ${foodImage(f)}<div class="row"><h3>${esc(f.name)}</h3><span class="badge">${esc(categoryName(f.categoryId))}</span></div>
  ${f.description?`<p class="muted">${esc(f.description)}</p>`:""}
  <div class="row"><div><span class="price">${money(f.price)}</span>${f.oldPrice?` <span class="old">${money(f.oldPrice)}</span>`:""}</div><span class="badge ${f.active?"green":"red"}">${f.active?"نمایش در فروشگاه":"مخفی"}</span></div>
  <div class="row wrap" style="margin-top:12px"><button class="btn primary" onclick="openFoodBuilder('${f.id}')">✏️ ویرایش کامل</button><button class="btn" onclick="toggleFood('${f.id}')">${f.active?"مخفی":"نمایش"}</button><button class="btn red" onclick="deleteFood('${f.id}')">🗑️ حذف</button></div>
 </div>`;
}
function filterFoodsAdmin(){
 const q=(document.getElementById("foodSearch")?.value||"").toLowerCase().trim();
 const c=document.getElementById("foodCatFilter")?.value||"";
 document.querySelectorAll(".food-admin-card").forEach(x=>{
   const okQ=!q||x.dataset.search.includes(q);
   const okC=!c||x.dataset.cat===c;
   x.style.display=(okQ&&okC)?"block":"none";
 });
}
function openFoodBuilder(id=""){
 const f=id?db.foods.find(x=>x.id===id):null;
 const cats=db.categories||[];
 document.getElementById("modalBox").innerHTML=`<h2>${f?"✏️ ویرایش کامل غذا":"🍔 افزودن غذای جدید"}</h2>
 <div class="note">از این بخش می‌توانی عکس، دسته‌بندی، قیمت، توضیحات، مواد اولیه، برچسب‌ها، زمان آماده‌سازی و وضعیت غذا را مدیریت کنی.</div><br>
 <div class="formgrid">
  <div class="field full"><label>عکس غذا</label><input id="fImage" type="file" accept="image/*" onchange="previewFoodImage(this)"><div id="foodImagePreview" style="margin-top:8px">${f?.image?`<img src="${f.image}" style="max-width:100%;max-height:220px;border-radius:14px">`:""}</div><button type="button" class="btn red" style="margin-top:8px" onclick="removeFoodImage()">حذف عکس</button></div>
  <div class="field"><label>نام غذا</label><input id="fName" value="${esc(f?.name||"")}" placeholder="مثلاً برگر ویژه"></div>
  <div class="field"><label>دسته‌بندی</label><select id="fCategory">${cats.map(c=>`<option value="${c.id}" ${f?.categoryId===c.id?"selected":""}>${c.emoji} ${esc(c.name)}</option>`).join("")}<option value="">بدون دسته</option></select></div>
  <div class="field"><label>قیمت فعلی (تومان)</label><input id="fPrice" type="number" min="0" value="${f?.price||0}"></div>
  <div class="field"><label>قیمت قبل از تخفیف</label><input id="fOldPrice" type="number" min="0" value="${f?.oldPrice||0}" placeholder="اختیاری"></div>
  <div class="field"><label>استیکر / ایموجی اختصاصی غذا</label><input id="fEmoji" value="${esc(f?.emoji||"🍔")}"></div>
  <div class="field"><label>زمان آماده‌سازی (دقیقه)</label><input id="fPrep" type="number" min="0" value="${f?.prepTime||0}"></div>
  <div class="field"><label>کالری تقریبی</label><input id="fCalories" type="number" min="0" value="${f?.calories||0}"></div>
  <div class="field full"><label>توضیحات کوتاه</label><textarea id="fDesc" rows="3" placeholder="توضیح جذاب درباره غذا...">${esc(f?.description||"")}</textarea></div>
  <div class="field full"><label>مواد اولیه</label><textarea id="fIngredients" rows="3" placeholder="مثلاً گوشت، پنیر، کاهو، سس...">${esc(f?.ingredients||"")}</textarea></div>
  <div class="field full"><label>برچسب‌ها</label><input id="fTags" value="${esc((f?.tags||[]).join(", "))}" placeholder="پرفروش، جدید، تند"></div>
  <div class="field"><label>وضعیت</label><select id="fActive"><option value="true" ${f?.active!==false?"selected":""}>نمایش در فروشگاه</option><option value="false" ${f?.active===false?"selected":""}>مخفی</option></select></div>
  <div class="field"><label>ویژه / پیشنهادی</label><select id="fFeatured"><option value="false" ${!f?.featured?"selected":""}>خیر</option><option value="true" ${f?.featured?"selected":""}>بله</option></select></div>
 </div><hr class="hr"><div class="row wrap"><button class="btn" onclick="closeModal()">لغو</button><button class="btn green" onclick="saveFood('${id}')">💾 ذخیره تغییرات</button></div>`;
 document.getElementById("modal").classList.add("show");
 window.__foodImage=f?.image||"";
}
function previewFoodImage(input){const file=input.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);window.__foodImage=c.toDataURL("image/jpeg",.82);document.getElementById("foodImagePreview").innerHTML=`<img src="${window.__foodImage}" style="max-width:100%;max-height:220px;border-radius:14px">`};img.src=r.result};r.readAsDataURL(file)}
function removeFoodImage(){window.__foodImage="";const p=document.getElementById("foodImagePreview");if(p)p.innerHTML="";const i=document.getElementById("fImage");if(i)i.value=""}
function saveFood(id){
 const name=document.getElementById("fName").value.trim(),price=Number(document.getElementById("fPrice").value),emoji=document.getElementById("fEmoji").value.trim()||"🍔";
 if(!name||price<=0)return toast("نام و قیمت معتبر وارد کن.");
 const data={name,price,emoji,image:window.__foodImage||"",categoryId:document.getElementById("fCategory").value,oldPrice:Number(document.getElementById("fOldPrice").value)||0,description:document.getElementById("fDesc").value.trim(),ingredients:document.getElementById("fIngredients").value.trim(),tags:document.getElementById("fTags").value.split(",").map(x=>x.trim()).filter(Boolean),prepTime:Number(document.getElementById("fPrep").value)||0,calories:Number(document.getElementById("fCalories").value)||0,active:document.getElementById("fActive").value==="true",featured:document.getElementById("fFeatured").value==="true"};
 if(id){const f=db.foods.find(x=>x.id===id);Object.assign(f,data)}else db.foods.push({id:uid("food"),...data});
 save();closeModal();toast("اطلاعات غذا ذخیره شد ✅");render();
}
function toggleFood(id){const f=db.foods.find(x=>x.id===id);if(f){f.active=!f.active;save();render()}}
function deleteFood(id){const f=db.foods.find(x=>x.id===id);if(!f)return;if(!confirm(`غذای «${f.name}» حذف شود؟`))return;db.foods=db.foods.filter(x=>x.id!==id);save();render();}
function openCategoryManager(){
 document.getElementById("modalBox").innerHTML=`<h2>🏷️ مدیریت دسته‌بندی‌ها</h2><div class="note">دسته‌بندی بساز، نام و ایموجی آن را تغییر بده یا حذفش کن. حذف دسته، خود غذاها را حذف نمی‌کند.</div><div class="formgrid" style="margin-top:12px"><div class="field"><label>نام دسته جدید</label><input id="newCatName" placeholder="مثلاً پاستا"></div><div class="field"><label>ایموجی</label><input id="newCatEmoji" value="🍽️"></div></div><button class="btn green" style="width:100%" onclick="addCategory()">＋ ساخت دسته</button><hr class="hr"><div id="catList">${renderCategoryList()}</div>`;
 document.getElementById("modal").classList.add("show");
}
function renderCategoryList(){return (db.categories||[]).map(c=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #20374e"><div><b>${c.emoji} ${esc(c.name)}</b><div class="muted" style="font-size:12px">${db.foods.filter(f=>f.categoryId===c.id).length} غذا</div></div><div class="row"><button class="btn" onclick="renameCategory('${c.id}')">✏️ تغییر</button><button class="btn red" onclick="deleteCategory('${c.id}')">حذف</button></div></div>`).join("")||`<div class="empty">هنوز دسته‌ای ساخته نشده.</div>`}

const CLOUD_API_BASE = (localStorage.getItem('LEMONADE_CLOUD_URL') || '').replace(/\/$/, '');
let cloudToken=safeLocalGet('LEMONADE_CLOUD_TOKEN','');
let cloudUsers=[];let cloudChats=[];let cloudSocket=null;let cloudBooted=false;
function cloudEnabled(){return !!(CLOUD_API_BASE&&cloudToken)}
async function cloudFetch(path,opts={}){
 const h=Object.assign({'Content-Type':'application/json'},opts.headers||{});if(cloudToken)h.Authorization='Bearer '+cloudToken;
 const r=await fetch(CLOUD_API_BASE+path,Object.assign({},opts,{headers:h}));
 let j={};try{j=await r.json()}catch{}
 if(!r.ok){const err=new Error(j.error||'خطای ارتباط با سرور');err.status=r.status;throw err;}return j;
}
function mergeCloudUser(x){if(!x?.id)return;let u=db.users.find(a=>a.id===x.id);if(!u){u={id:x.id,name:x.name,phone:x.phone,password:'',points:0,createdAt:x.createdAt||new Date().toISOString(),online:false,onlineVisible:x.onlineVisible!==false,lastSeenAt:x.lastSeenAt||null,savedAddress:'',savedPlaque:'',banned:!!x.banned,blockedUsers:[]};db.users.push(u)}Object.assign(u,{name:x.name,phone:x.phone,online:!!x.online,onlineVisible:x.onlineVisible!==false,lastSeenAt:x.lastSeenAt||null,banned:!!x.banned});return u}
async function cloudRefresh(){if(!cloudEnabled())return;try{const [u,c]=await Promise.all([cloudFetch('/api/users'),cloudFetch('/api/chats')]);cloudUsers=u.users||[];cloudChats=c.chats||[];cloudUsers.forEach(mergeCloudUser);for(const ch of cloudChats){let old=db.chats.find(x=>x.id===ch.id);if(!old)db.chats.push({id:ch.id,type:ch.type,name:'',memberIds:ch.memberIds,createdAt:ch.createdAt});else old.memberIds=ch.memberIds;}safeLocalSet(DBKEY,JSON.stringify(db));}catch(e){console.warn('cloud refresh',e.message)}}
async function cloudLoadMessages(chatId){if(!cloudEnabled())return;try{const r=await cloudFetch('/api/chats/'+encodeURIComponent(chatId)+'/messages');db.messages=db.messages.filter(m=>m.chatId!==chatId).concat(r.messages||[]);safeLocalSet(DBKEY,JSON.stringify(db));}catch(e){console.warn('messages',e.message)}}
function cloudConnectSocket(){if(!cloudEnabled()||cloudSocket)return;const proto=location.protocol==='https:'?'wss':'ws';const base=(location.protocol==='http:'||location.protocol==='https:')?proto+'://'+location.host:'';const url=base+'/ws?token='+encodeURIComponent(cloudToken);try{cloudSocket=new WebSocket(url);cloudSocket.onmessage=e=>{try{const x=JSON.parse(e.data);if(x.type==='message'){if(!db.messages.some(m=>m.id===x.message.id))db.messages.push(x.message);safeLocalSet(DBKEY,JSON.stringify(db));if(window.__activeChat===x.message.chatId)render()}else if(x.type==='user.created'||x.type==='presence'){mergeCloudUser(x.user);safeLocalSet(DBKEY,JSON.stringify(db));if(tab==='chat')render()}else if(x.type==='chat.created'){if(!db.chats.some(c=>c.id===x.chat.id))db.chats.push(x.chat);safeLocalSet(DBKEY,JSON.stringify(db));if(tab==='chat')render()}}catch{}};cloudSocket.onclose=()=>{cloudSocket=null;if(cloudToken)setTimeout(cloudConnectSocket,3000)};}catch{cloudSocket=null}}
async function cloudRegister(name,phone,password){const r=await cloudFetch('/api/register',{method:'POST',body:JSON.stringify({name,phone,password})});cloudToken=r.token;localStorage.setItem('LEMONADE_CLOUD_TOKEN',cloudToken);mergeCloudUser(r.user);cloudBooted=true;cloudConnectSocket();await cloudRefresh();return r.user}
async function cloudLogin(phone,password){const r=await cloudFetch('/api/login',{method:'POST',body:JSON.stringify({phone,password})});cloudToken=r.token;localStorage.setItem('LEMONADE_CLOUD_TOKEN',cloudToken);mergeCloudUser(r.user);cloudBooted=true;cloudConnectSocket();await cloudRefresh();return r.user}
async function cloudLogout(){try{if(cloudEnabled())await cloudFetch('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('LEMONADE_CLOUD_TOKEN');cloudToken='';if(cloudSocket){cloudSocket.close();cloudSocket=null}}

    if(!f)return toast('پیتزا جایزه در منو پیدا نشد.');
    if(u.pizzaRewardClaimed)return toast('جایزه قبلاً دریافت شده است.');
    u.pizzaRewardClaimed=true;cart.push({type:'food',id:f.id,qty:1,award:true,unitOverride:0});saveCart();toast('پیتزا جایزه به سبد اضافه شد 🎁🍕');tab='cart';render();saveFeatureState();
  };
  window.setTab=setTab;
  const oldCustomerContent=customerContent;
  customerContent=function(){if(tab==='game')return gamePage();if(tab==='points')return pointsPage();return oldCustomerContent();};
  function pointsPage(){
  const __pu = (typeof currentUser==="function") ? currentUser() : null;
  const __score = Math.max(0, Math.min(1000, Number(__pu?.gameScore||0)));
  const __pct = Math.round(__score/10);
  const pizzaProgressBar = `<div style="margin:14px 0;padding:14px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <b>🍕 پیتزا مخصوص لیموناد</b><span>${__pct}%</span>
    </div>
    <div style="height:14px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden">
      <div style="width:${__pct}%;height:100%;border-radius:999px;background:linear-gradient(90deg,#31e981,#ffd700);transition:width .4s ease"></div>
    </div>
    <small style="display:block;margin-top:8px;opacity:.75">${__score}/1000 امتیاز</small>
    ${__score>=1000 ? '<div style="margin-top:10px;font-weight:800">🎉 جایزه آماده دریافت است!</div>' : ''}
  </div>`;
const u=gameUser();if(!u)return homePage();return `${pizzaProgressBar}<section class="hero"><h1>⭐ امتیازهای من</h1><p>امتیاز بازی و امتیاز وفاداری خرید را یکجا ببین.</p></section><div class="grid"><div class="card"><h3>🎮 امتیاز مینی‌گیم</h3><div class="price">${u.gameScore}/1000</div></div><div class="card"><h3>⭐ امتیاز وفاداری</h3><div class="price">${u.loyaltyPoints||0}</div><p class="muted">هر ۱۰٬۰۰۰ تومان مبلغ نهایی سفارش = ۱ امتیاز</p></div></div>${u.gameScore>=1000?`<div class="card"><h3>🏆 جایزه</h3><p>پیتزا مخصوص لیموناد یک‌نفره</p><span class="badge green">${u.pizzaRewardClaimed?'دریافت شده':'قابل دریافت'}</span></div>`:''}`}
  window.pointsPage=pointsPage;
  const oldTopbar=topbar;
  topbar=function(title){
    let out=oldTopbar(title);
    if(mode==='customer'&&session?.userId){
      const extra=`<button class="btn ${tab==='game'?'primary':''}" onclick="setTab('game')">🎮 مینی‌گیم</button><button class="btn ${tab==='points'?'primary':''}" onclick="setTab('points')">⭐ امتیازهای من</button>`;
      const marker=`<button class="btn ${tab==="settings"?"primary":""}" onclick="setTab('settings')">⚙️ تنظیمات</button>`;
      out=out.replace(marker,extra+marker);
    }
    return out;
  };
  /* Coupons */
  function couponValid(c){const now=Date.now();return c&&c.published!==false&&(!c.startAt||now>=new Date(c.startAt).getTime())&&(!c.endAt||now<=new Date(c.endAt).getTime())&&(Number(c.maxUses||0)<=0||Number(c.used||0)<Number(c.maxUses))}
  function calcCoupon(c,subtotal){if(!couponValid(c))return 0;let d=c.type==='percent'?Math.floor(subtotal*Number(c.value||0)/100):Math.floor(Number(c.value||0));return Math.min(subtotal,Math.max(0,d))}
  window.applyCoupon=function(){const code=(document.getElementById('couponCode')?.value||'').trim().toUpperCase();const msg=document.getElementById('couponMsg');if(!code)return toast('کد تخفیف را وارد کن.');const c=db.coupons.find(x=>String(x.code).toUpperCase()===code);const sub=cartTotal();if(!c||!couponValid(c)){if(msg)msg.textContent='کد نامعتبر، منقضی یا غیرفعال است.';return}const d=calcCoupon(c,sub);window.__appliedCoupon={code:c.code,discount:d};if(msg)msg.textContent=`تخفیف ${money(d)} اعمال شد.`;const totalEl=document.getElementById('checkoutTotal');if(totalEl)totalEl.textContent=money(sub-d);toast('کد تخفیف اعمال شد 🎉');};
  window.removeCoupon=function(){window.__appliedCoupon=null;render()};
  const oldCheckout=checkoutPage;
  checkoutPage=function(){const u=gameUser();if(!u)return homePage();const sub=cartTotal(),c=window.__appliedCoupon,d=c?c.discount:0;return `<div class="section-title"><h2>📦 ثبت سفارش</h2></div><div class="card"><div class="formgrid"><div class="field"><label>نام گیرنده</label><input id="coName" value="${esc(u.name)}"></div><div class="field"><label>شماره تلفن</label><input id="coPhone" value="${esc(u.phone||'')}"></div><div class="field full"><label>آدرس کامل</label><textarea id="coAddress" rows="3">${esc(u.savedAddress||'')}</textarea></div><div class="field"><label>پلاک</label><input id="coPlaque" value="${esc(u.savedPlaque||'')}"></div><div class="field"><label>تاریخ تحویل</label><input id="coDate" type="date"></div><div class="field"><label>ساعت تحویل</label><input id="coTime" type="time"></div><div class="field full"><label>توضیحات</label><textarea id="coNote" rows="2"></textarea></div></div><hr class="hr"><div class="card"><h3>🏷️ کد تخفیف</h3><div class="row"><input id="couponCode" placeholder="مثلاً G545F1K" style="flex:1" value="${c?esc(c.code):''}"><button class="btn yellow" onclick="applyCoupon()">اعمال</button></div><div id="couponMsg" class="muted" style="margin-top:8px">${c?`تخفیف ${money(d)} اعمال شده.`:'اگر کد تخفیف داری اینجا وارد کن.'}</div></div><div class="row"><span>جمع اولیه</span><b>${money(sub)}</b></div><div class="row"><span>تخفیف</span><b class="green">-${money(d)}</b></div><div class="row"><span>مبلغ نهایی</span><b id="checkoutTotal" class="price">${money(sub-d)}</b></div><button class="btn green" style="width:100%;margin-top:15px" onclick="submitOrder()">ثبت نهایی سفارش</button></div>`;};
  const oldSubmit=submitOrder;
  submitOrder=async function(){
    const address=document.getElementById('coAddress')?.value.trim();if(!address)return toast('آدرس را وارد کن.');const items=cartDetails();if(!items.length)return toast('سبد خرید خالی است.');
    const u=gameUser();const subtotal=cartTotal();let coupon=window.__appliedCoupon;let discount=coupon?.discount||0;
    if(coupon){const c=db.coupons.find(x=>String(x.code).toUpperCase()===String(coupon.code).toUpperCase());if(!c||!couponValid(c)){window.__appliedCoupon=null;return toast('کد تخفیف دیگر معتبر نیست.');}discount=calcCoupon(c,subtotal);}
    const total=Math.max(0,subtotal-discount);const earnedLoyalty=Math.max(1,Math.floor(total/10000));const oldLoyalty=Number(u.loyaltyPoints||u.points||0);u.phone=document.getElementById('coPhone').value.trim();
    const order={id:uid('ord'),userId:u.id,name:document.getElementById('coName').value.trim(),phone:u.phone,address,plaque:document.getElementById('coPlaque').value.trim(),deliveryDate:document.getElementById('coDate').value,deliveryTime:document.getElementById('coTime').value,note:document.getElementById('coNote').value.trim(),items:items.map(x=>({type:x.type,id:x.id,name:x.name,qty:x.qty,unit:x.unit,total:x.total})),subtotal,discountAmount:discount,couponCode:coupon?.code||'',total,status:'در حال آماده‌سازی',createdAt:new Date().toISOString(),adminDeliveredAt:null,customerConfirmedAt:null,closedAt:null};
    db.orders.unshift(order);if(coupon){const cc=db.coupons.find(x=>x.code===coupon.code);if(cc)cc.used=(cc.used||0)+1;}cart=[];saveCart();saveFeatureState();window.__appliedCoupon=null;
    if(CLOUD_API_BASE&&cloudToken){try{const r=await cloudFetch('/api/orders',{method:'POST',body:JSON.stringify(order)});if(r.order)db.orders[0]=r.order;u.loyaltyPoints=oldLoyalty+earnedLoyalty;u.points=u.loyaltyPoints;}catch(e){u.loyaltyPoints=oldLoyalty+earnedLoyalty;u.points=u.loyaltyPoints;console.warn('cloud order',e.message)}}else{u.loyaltyPoints=oldLoyalty+earnedLoyalty;u.points=u.loyaltyPoints;}
    toast(`سفارش ثبت شد 🎉 ${discount?`تخفیف ${money(discount)} اعمال شد.`:''}`);tab='orders';render();
  };

  /* Admin coupon manager */
  const oldAdminContent=adminContent;
  adminContent=function(){if(tab==='coupons')return adminCoupons();return oldAdminContent();};
  function adminCoupons(){return `<div class="section-title"><h2>🏷️ مدیریت کدهای تخفیف</h2><span class="badge">${db.coupons.length} کد</span></div><div class="card"><div class="formgrid"><div class="field"><label>کد دلخواه</label><input id="cpCode" placeholder="G545F1K"></div><div class="field"><label>نوع تخفیف</label><select id="cpType"><option value="percent">درصدی</option><option value="fixed">مبلغ ثابت</option></select></div><div class="field"><label>مقدار</label><input id="cpValue" type="number" min="0" placeholder="مثلاً 15"></div><div class="field"><label>حداکثر استفاده</label><input id="cpMax" type="number" min="0" value="0"><small class="muted">۰ = بدون محدودیت</small></div><div class="field"><label>شروع</label><input id="cpStart" type="datetime-local"></div><div class="field"><label>پایان</label><input id="cpEnd" type="datetime-local"></div></div><label><input id="cpPublished" type="checkbox" checked> انتشار کد برای مشتری</label><button class="btn green" style="width:100%;margin-top:14px" onclick="createCoupon()">＋ ساخت کد تخفیف</button></div>${db.coupons.map(c=>`<div class="card"><div class="row"><b>${esc(c.code)}</b><span class="badge ${c.published!==false?'green':'red'}">${c.published!==false?'منتشر شده':'خاموش'}</span></div><p>${c.type==='percent'?c.value+'٪ تخفیف':money(c.value)+' تخفیف'} • استفاده ${c.used||0}/${c.maxUses||'∞'}</p><p class="muted">${c.startAt?'شروع: '+formatDate(c.startAt):'بدون شروع'} | ${c.endAt?'پایان: '+formatDate(c.endAt):'بدون پایان'}</p><div class="row"><button class="btn" onclick="toggleCoupon('${c.id}')">${c.published!==false?'خاموش کردن':'انتشار'}</button><button class="btn red" onclick="deleteCoupon('${c.id}')">حذف</button></div></div>`).join('')||'<div class="empty">هنوز کد تخفیفی ساخته نشده.</div>'}`}
  async function couponPersist(){save();if(CLOUD_API_BASE&&localStorage.getItem('LEMONADE_ADMIN_TOKEN')){try{await fetch(CLOUD_API_BASE+'/api/admin/coupons',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('LEMONADE_ADMIN_TOKEN')},body:JSON.stringify(db.coupons[0])});}catch(e){}}}
  async function syncCouponsCloud(){try{const r=await fetch(CLOUD_API_BASE+'/api/admin/coupons',{headers:{Authorization:'Bearer '+localStorage.getItem('LEMONADE_ADMIN_TOKEN')}});if(r.ok){const j=await r.json();db.coupons=j.coupons||db.coupons;safeLocalSet(DBKEY,JSON.stringify(db));}}catch(e){}}
  window.createCoupon=async function(){let code=(document.getElementById('cpCode')?.value||'').trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');const type=document.getElementById('cpType')?.value||'percent';const value=Number(document.getElementById('cpValue')?.value||0);if(!code||!value)return toast('کد و مقدار تخفیف را کامل کن.');if(db.coupons.some(x=>x.code===code))return toast('این کد قبلاً ساخته شده.');const payload={code,type,value,maxUses:Number(document.getElementById('cpMax')?.value||0),published:document.getElementById('cpPublished')?.checked!==false,startAt:document.getElementById('cpStart')?.value?new Date(document.getElementById('cpStart').value).toISOString():null,endAt:document.getElementById('cpEnd')?.value?new Date(document.getElementById('cpEnd').value).toISOString():null};let c={...payload,id:uid('cp'),used:0,createdAt:new Date().toISOString()};if(CLOUD_API_BASE&&localStorage.getItem('LEMONADE_ADMIN_TOKEN')){try{const r=await fetch(CLOUD_API_BASE+'/api/admin/coupons',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('LEMONADE_ADMIN_TOKEN')},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error||'ساخت کد ناموفق بود');c=j.coupon;}catch(e){return toast(e.message)}}db.coupons.unshift(c);save();toast('کد تخفیف ساخته شد ✅');render();};
  window.toggleCoupon=async function(id){const c=db.coupons.find(x=>x.id===id);if(!c)return;c.published=c.published===false;save();if(CLOUD_API_BASE&&localStorage.getItem('LEMONADE_ADMIN_TOKEN')){try{await fetch(CLOUD_API_BASE+'/api/admin/coupons/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('LEMONADE_ADMIN_TOKEN')},body:JSON.stringify({published:c.published})})}catch(e){}}render()};
  window.deleteCoupon=async function(id){db.coupons=db.coupons.filter(x=>x.id!==id);save();if(CLOUD_API_BASE&&localStorage.getItem('LEMONADE_ADMIN_TOKEN')){try{await fetch(CLOUD_API_BASE+'/api/admin/coupons/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+localStorage.getItem('LEMONADE_ADMIN_TOKEN')}})}catch(e){}}toast('کد حذف شد.');render()};
  const oldAdminTop=topbar;
  topbar=function(title){
    let out=oldAdminTop(title);
    if(mode==='admin'){
      const extra=`<button class="btn ${tab==='coupons'?'primary':''}" onclick="setTab('coupons')">🏷️ کد تخفیف</button>`;
      const marker=`<button class="btn \${tab==="bugs"?"primary":""}" onclick="setTab('bugs')">🐞 گزارش باگ</button>`;
      out=out.replace(marker,extra+marker);
    }
    return out;
  };
  /* Load cloud profile once after login/start. */
  setTimeout(()=>{if(cloudEnabled())loadProfileCloud();},500);
  setInterval(()=>{const u=gameUser();if(u&&u.gameLockedUntil&&Date.now()>=u.gameLockedUntil){u.gameLockedUntil=0;saveFeatureState();if(tab==='game')render();}},1000);
})();
</script>
